name: Update recent facility standard changes

on:
  workflow_dispatch:
  schedule:
    # 各局の月2回前後の掲載日を広く拾う。02:00 UTC = 11:00 JST。
    - cron: "0 2 2,9,16,23,28 * *"

permissions:
  contents: write

concurrency:
  group: update-facility-standards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Update recent PDF changes
        run: npm run update:recent

      - name: Commit changed data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- public/v1/changes)" ]]; then
            echo "No recent data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v1/changes
          git commit -m "chore(data): update recent facility standard changes"
          git push
