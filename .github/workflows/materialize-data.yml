name: Materialize verified recent data

on:
  push:
    branches:
      - agent/harden-data-reliability

permissions:
  contents: write

concurrency:
  group: materialize-agent-data
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run check
          npm test

      - name: Regenerate and verify recent data
        run: |
          npm run update:recent
          npm run verify

      - name: Commit verified generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/v1/changes
          if git diff --cached --quiet; then
            echo "Expected regenerated data changes, but none were produced"
            exit 1
          fi
          git commit -m "regenerate verified recent data"
          git push origin HEAD:"${GITHUB_REF_NAME}"
