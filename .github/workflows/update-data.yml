name: Update facility standards

on:
  workflow_dispatch:
  schedule:
    # 毎月15日 09:00 JST。各局の月初〜10日頃の更新を待って取得する。
    - cron: "0 0 15 * *"

permissions:
  contents: write

concurrency:
  group: update-facility-standards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Update static JSON
        run: npm run update

      - name: Commit changed data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- public/v1)" ]]; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/v1
          git commit -m "chore(data): update facility standards"
          git push
